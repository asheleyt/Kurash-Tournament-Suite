<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting Kurash Tournament Suite...</title>
    <style>
        /* ============================================================
           KTS Loading Screen — Hacker Terminal
           ============================================================ */

        :root {
            color-scheme: dark;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* --- Body fills the Electron window directly --- */
        body {
            background: linear-gradient(160deg, #0a0f18 0%, #05080c 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 48px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Logo --- */
        .kts-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            border-radius: 18px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(0, 229, 255, 0.15));
        }

        .kts-logo-fallback {
            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* --- Heading --- */
        .kts-heading {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.1;
        }

        /* --- Subtitle (glowing yellow) --- */
        .kts-subtitle {
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            color: #ffcc00;
            text-shadow:
                0 0 10px rgba(255, 204, 0, 0.35),
                0 0 30px rgba(255, 204, 0, 0.12);
            margin-bottom: 24px;
        }

        /* --- Progress Bar (4px thin) --- */
        .kts-progress-track {
            position: relative;
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: rgba(0, 229, 255, 0.07);
            margin-bottom: 28px;
            overflow: visible;
        }

        .kts-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 8%;
            min-width: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, #00e5ff, #0077ff);
            transition: width 0.4s ease;
        }

        /* Glowing head */
        .kts-progress-fill::after {
            content: "";
            position: absolute;
            top: 50%;
            right: -6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: radial-gradient(circle,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(0, 229, 255, 0.5) 50%,
                transparent 100%);
            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.6),
                0 0 18px rgba(0, 229, 255, 0.45),
                0 0 32px rgba(0, 229, 255, 0.15);
            animation: kts-pulse 1.4s ease-in-out infinite;
        }

        @keyframes kts-pulse {
            0%, 100% { transform: translateY(-50%) scale(0.85); opacity: 0.75; }
            50%      { transform: translateY(-50%) scale(1.15); opacity: 1; }
        }

        /* --- Terminal --- */
        .kts-terminal {
            width: 100%;
            border: 1px solid rgba(0, 229, 255, 0.18);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.35);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .kts-terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 12px;
            background: rgba(0, 229, 255, 0.04);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 0.68rem;
            color: rgba(0, 229, 255, 0.45);
            flex-shrink: 0;
        }

        .kts-terminal-header-label {
            font-weight: 600;
        }

        .kts-terminal-header-version {
            opacity: 0.55;
        }

        .kts-terminal-body {
            padding: 10px 12px;
            overflow-y: auto;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            line-height: 1.65;
            color: #00e5ff;
            flex: 1;
            min-height: 0;
        }

        /* Custom scrollbar */
        .kts-terminal-body::-webkit-scrollbar {
            width: 4px;
        }
        .kts-terminal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .kts-terminal-body::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.18);
            border-radius: 2px;
        }

        /* Terminal line segments */
        .kts-terminal-line {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .kts-terminal-line .kts-ts {
            color: rgba(0, 229, 255, 0.35);
        }
        .kts-terminal-line .kts-tag {
            color: #00e5ff;
            font-weight: 600;
        }
        .kts-terminal-line .kts-msg {
            color: rgba(255, 255, 255, 0.7);
        }
        .kts-terminal-line .kts-ok {
            color: #4ade80;
            font-weight: 600;
        }
        .kts-terminal-line .kts-name {
            color: #ffcc00;
        }

        /* Blinking cursor */
        .kts-cursor {
            display: inline-block;
            width: 7px;
            height: 1em;
            background: #00e5ff;
            vertical-align: text-bottom;
            margin-left: 1px;
            animation: kts-blink 0.7s step-end infinite;
        }
        @keyframes kts-blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* --- Footer --- */
        .kts-footer {
            margin-top: 14px;
            text-align: center;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.22);
            flex-shrink: 0;
        }

        /* --- Failure Mode --- */
        html[data-mode="failure"] .kts-progress-fill {
            background: linear-gradient(90deg, #f97316, #ef4444);
        }
        html[data-mode="failure"] .kts-progress-fill::after {
            background: radial-gradient(circle,
                rgba(255, 245, 240, 0.95) 0%,
                rgba(249, 115, 22, 0.5) 50%,
                transparent 100%);
            box-shadow:
                0 0 8px rgba(255, 245, 240, 0.5),
                0 0 18px rgba(249, 115, 22, 0.45);
        }
        html[data-mode="failure"] .kts-subtitle {
            color: #f97316;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.35);
        }
        html[data-mode="failure"] .kts-terminal {
            border-color: rgba(249, 115, 22, 0.22);
        }
        html[data-mode="failure"] .kts-terminal-header {
            background: rgba(249, 115, 22, 0.04);
            border-bottom-color: rgba(249, 115, 22, 0.1);
            color: rgba(249, 115, 22, 0.45);
        }

        /* --- Reduced Motion --- */
        @media (prefers-reduced-motion: reduce) {
            .kts-progress-fill { transition: none; }
            .kts-progress-fill::after { animation: none; }
            .kts-cursor { animation: none; opacity: 1; }
        }

        /* --- Debug Mode Banner --- */
        .kts-debug-banner {
            position: fixed;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.3);
            color: #ffcc00;
            font-family: 'Consolas', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Logo: real image with CSS fallback -->
    <img
        id="brandLogo"
        class="kts-logo"
        src="./startup-assets/kts-icon.png"
        alt="Kurash Tournament Suite"
    />
    <div id="brandLogoFallback" class="kts-logo-fallback" hidden>KTS</div>

    <!-- Wordmark: hidden, kept for API element ID contract -->
    <img id="brandWordmark" src="./startup-assets/kurash-wordmark.png" alt="" hidden />
    <div id="brandWordmarkFallback" hidden></div>

    <!-- Title -->
    <h1 id="startupHeading" class="kts-heading">KURASH TOURNAMENT SUITE</h1>

    <!-- Subtitle -->
    <div id="startupSubtitle" class="kts-subtitle">STARTING CONTROLLER</div>

    <!-- Progress Bar -->
    <div
        id="startupProgress"
        class="kts-progress-track"
        role="progressbar"
        aria-label="Application startup progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="8"
        aria-valuetext="Boot in progress"
    >
        <div id="startupProgressFill" class="kts-progress-fill"></div>
    </div>

    <!-- Terminal -->
    <div class="kts-terminal">
        <div class="kts-terminal-header">
            <span id="startupStatusLabel" class="kts-terminal-header-label">system_boot.log</span>
            <span class="kts-terminal-header-version">v1.0.0</span>
        </div>
        <div id="startupStatusText" class="kts-terminal-body">
            <span class="kts-cursor"></span>
        </div>
    </div>

    <!-- Footer -->
    <div id="startupFooterNote" class="kts-footer">
        First launch after install may take a little longer.
    </div>

    <!-- Helper note (hidden, used by API) -->
    <div id="startupHelperNote" hidden>Repeated launches will refocus this window.</div>

    <!-- Debug mode banner (hidden unless ?debug) -->
    <div id="ktsDebugBanner" class="kts-debug-banner" hidden>DEBUG — 3s per line</div>

    <script>
    (function () {
        'use strict';

        var root = document.documentElement;
        var terminalBody = document.getElementById('startupStatusText');
        var progressFill = document.getElementById('startupProgressFill');
        var progressTrack = document.getElementById('startupProgress');

        /* ----------------------------------------------------------
           Element map — every key that setText() can target
           ---------------------------------------------------------- */
        var elements = {
            brandLogo:          document.getElementById('brandLogo'),
            brandLogoFallback:  document.getElementById('brandLogoFallback'),
            brandWordmark:      document.getElementById('brandWordmark'),
            brandWordmarkFallback: document.getElementById('brandWordmarkFallback'),
            heading:            document.getElementById('startupHeading'),
            subtitle:           document.getElementById('startupSubtitle'),
            statusLabel:        document.getElementById('startupStatusLabel'),
            statusText:         terminalBody,
            helperNote:         document.getElementById('startupHelperNote'),
            footerNote:         document.getElementById('startupFooterNote'),
            progressTrack:      progressTrack,
            progressFill:       progressFill,
        };

        /* ----------------------------------------------------------
           Image fallback: if the real logo fails to load, show the
           CSS fallback and hide the <img>.  If it loads, hide the
           fallback and keep the <img> visible.
           ---------------------------------------------------------- */
        function bindImageFallback(imgKey, fbKey) {
            var img = elements[imgKey];
            var fb  = elements[fbKey];
            if (!img || !fb) return;

            var showImg = function () { img.hidden = false; fb.hidden = true; };
            var showFb  = function () { img.hidden = true;  fb.hidden = false; };

            img.addEventListener('load', showImg);
            img.addEventListener('error', showFb);

            // Already cached?
            if (img.complete && img.naturalWidth > 0) { showImg(); }
            else if (img.complete)                    { showFb(); }
        }

        /* ----------------------------------------------------------
           Low-level helpers
           ---------------------------------------------------------- */
        function setText(key, value) {
            if (!elements[key] || typeof value !== 'string') return;
            var v = value.trim();
            if (!v) return;
            elements[key].textContent = v;
        }

        function setMode(mode) {
            root.dataset.mode = mode === 'failure' ? 'failure' : 'booting';
        }

        function setProgress(value) {
            var n = Number(value);
            if (!Number.isFinite(n)) { resetProgress(); return; }
            var c = Math.max(0, Math.min(100, n));
            // width accounts for the 16px glowing head overlapping the track edge
            progressFill.style.width = c <= 0 ? '0px' : 'calc(' + c + '% - 4px)';
            progressTrack.setAttribute('aria-valuenow', String(Math.round(c)));
            progressTrack.setAttribute('aria-valuetext', Math.round(c) + '% complete');
        }

        function resetProgress() {
            setProgress(8);
            var lbl = elements.statusLabel ? elements.statusLabel.textContent : '';
            progressTrack.setAttribute('aria-valuetext', lbl || 'Boot in progress');
        }

        /* ----------------------------------------------------------
           Boot-log typing animation
           ---------------------------------------------------------- */
        var bootLines = [
            { tag: 'DB',     msg: 'Establishing local database socket...',               st: 'ok' },
            { tag: 'KTS',    msg: 'Developed by ',          name: 'Jhon Carlo Trinilla', st: 'perfect' },
            { tag: 'WARN',   msg: 'Bypassing logic loop processing...',                  st: 'resolved' },
            { tag: 'Event Host', msg: 'Developed by ',      name: 'Asheleyt Jan Rubi',   st: 'ok' },
            { tag: 'NET',    msg: 'WebSocket relay initialized...',                      st: 'connected' },
            { tag: 'Kurash Website', msg: 'Developed by ',   name: 'Kian Santos',        st: 'loaded' },
            { tag: 'PALVAN', msg: 'Tournament engine by ',  name: 'Brian Llamas',        st: 'online' },
            { tag: 'BOOT',   msg: 'KTS v1.0.0 ready. Launching controller...',           st: 'ok' },
        ];

        var bootIdx = 0;
        var bootActive = true;
        var debugMode = /[?&]debug\b/.test(window.location.search);

        function ts() {
            var d = new Date();
            return String(d.getHours()).padStart(2,'0') + ':' +
                   String(d.getMinutes()).padStart(2,'0') + ':' +
                   String(d.getSeconds()).padStart(2,'0');
        }

        function lineHTML(l) {
            var h = '<span class="kts-ts">[' + ts() + ']</span> ' +
                    '<span class="kts-tag">[' + l.tag + ']</span> ' +
                    '<span class="kts-msg">' + l.msg + '</span>';
            if (l.name) h += '<span class="kts-name">' + l.name + '</span>';
            var s = l.st;
            if (s === 'ok')       h += ' <span class="kts-ok">OK</span>';
            if (s === 'resolved') h += ' <span class="kts-ok">Resolved.</span>';
            if (s === 'perfect')  h += '<span class="kts-ok">...Perfect.</span>';
            if (s === 'connected')h += ' <span class="kts-ok">Connected.</span>';
            if (s === 'loaded')   h += ' <span class="kts-ok">Loaded.</span>';
            if (s === 'online')   h += ' <span class="kts-ok">Online.</span>';
            return h;
        }

        function appendLine(html) {
            var div = document.createElement('div');
            div.className = 'kts-terminal-line';
            div.innerHTML = html;
            var cursor = terminalBody.querySelector('.kts-cursor');
            if (cursor) terminalBody.insertBefore(div, cursor);
            else        terminalBody.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function typeNext() {
            if (!bootActive || bootIdx >= bootLines.length) {
                var cur = terminalBody.querySelector('.kts-cursor');
                if (cur) cur.remove();
                return;
            }
            var line = bootLines[bootIdx++];
            appendLine(lineHTML(line));

            // Progress mirrors the terminal — 8 % baseline, +82 % spread across lines
            setProgress(8 + Math.round((bootIdx / bootLines.length) * 82));

            var delay = debugMode ? 3000 : (300 + Math.floor(Math.random() * 800));
            setTimeout(typeNext, delay);
        }

        function startBoot() {
            bootActive = true;
            bootIdx = 0;
            setTimeout(typeNext, 400);
        }

        /* ----------------------------------------------------------
           KTSStartupScreen API  (exact contract for index.js)
           ---------------------------------------------------------- */
        window.KTSStartupScreen = {
            applyState: function (s) {
                if (!s || typeof s !== 'object') return;
                if (typeof s.mode       === 'string') setMode(s.mode);
                if (typeof s.heading    === 'string') setText('heading', s.heading);
                if (typeof s.subtitle   === 'string') setText('subtitle', s.subtitle);
                if (typeof s.statusLabel=== 'string') this.setStatusLabel(s.statusLabel);
                if (typeof s.statusText === 'string') setText('statusText', s.statusText);
                if (typeof s.helperNote === 'string') setText('helperNote', s.helperNote);
                if (typeof s.footerNote === 'string') setText('footerNote', s.footerNote);
                if (Object.prototype.hasOwnProperty.call(s, 'progress')) setProgress(s.progress);
                // Real boot stage — append a formatted line to the terminal
                if (s.logLine && typeof s.logLine === 'object') {
                    appendLine(lineHTML(s.logLine));
                }
            },
            setMode:          setMode,
            setHeading:       function (v) { setText('heading', v); },
            setSubtitle:      function (v) { setText('subtitle', v); },
            setStatusLabel:   function (v) {
                setText('statusLabel', v);
                var t = typeof v === 'string' ? v.trim() : '';
                progressTrack.setAttribute('aria-valuetext', t || 'Boot in progress');
            },
            setStatusText:    function (v) { setText('statusText', v); },
            setHelperNote:    function (v) { setText('helperNote', v); },
            setFooterNote:    function (v) { setText('footerNote', v); },
            setProgress:      setProgress,
            resetProgress:    resetProgress,
        };

        /* ----------------------------------------------------------
           Init
           ---------------------------------------------------------- */
        setMode('booting');
        bindImageFallback('brandLogo', 'brandLogoFallback');
        setProgress(8);
        if (debugMode) document.getElementById('ktsDebugBanner').hidden = false;
        startBoot();
    })();
    </script>
</body>
</html>
